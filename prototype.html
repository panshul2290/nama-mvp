<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Integrated Digital Tanker Operations Platform — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDEE;--panel:#FFFFFF;--sunk:#F3F6F6;--ink:#13232E;--muted:#5B6B75;--line:#D3DCDF;
  --nav:#0F2D3D;--navInk:#BFD3DA;--navOn:#FFFFFF;--accent:#0B7A8F;--accentInk:#FFFFFF;
  --dw:#2563C9;--ww:#8A6420;--te:#2F8A55;
  --land:#E9E4D6;--sea:#CBE1E8;--zoneLine:#C9BFA6;--road:#FFFFFF;--label:#7A7060;
  --ok:#2F8A55;--warn:#B8740A;--bad:#C2372B;
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C181E;--panel:#13242C;--sunk:#0F1E25;--ink:#E2EBEE;--muted:#8DA1AA;--line:#24404B;
  --nav:#071218;--navInk:#8FA7B0;--navOn:#FFFFFF;--accent:#2BA3B8;--accentInk:#05161C;
  --dw:#5B93F0;--ww:#C79A4B;--te:#55B97C;
  --land:#1A2A2F;--sea:#0D2833;--zoneLine:#2F4549;--road:#2B434C;--label:#7F9399;
  --ok:#55B97C;--warn:#E0A33A;--bad:#E8665A;}}
:root[data-theme="dark"]{
  --bg:#0C181E;--panel:#13242C;--sunk:#0F1E25;--ink:#E2EBEE;--muted:#8DA1AA;--line:#24404B;
  --nav:#071218;--navInk:#8FA7B0;--navOn:#FFFFFF;--accent:#2BA3B8;--accentInk:#05161C;
  --dw:#5B93F0;--ww:#C79A4B;--te:#55B97C;
  --land:#1A2A2F;--sea:#0D2833;--zoneLine:#2F4549;--road:#2B434C;--label:#7F9399;
  --ok:#55B97C;--warn:#E0A33A;--bad:#E8665A;}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;height:100%}
nav.side{background:var(--nav);color:var(--navInk);display:flex;flex-direction:column;padding:18px 12px;gap:2px;overflow-y:auto}
.brand{color:var(--navOn);font-weight:600;font-size:15px;line-height:1.3;padding:0 10px 14px}
.brand small{display:block;font-weight:400;color:var(--navInk);font-size:12px;margin-top:4px}
.navgroup{font-size:12px;color:var(--navInk);opacity:.75;padding:14px 10px 4px}
.navbtn{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:7px 10px;border-radius:6px;color:var(--navInk);font-size:14px}
.navbtn:hover{background:rgba(255,255,255,.06)}
.navbtn.on{background:rgba(255,255,255,.1);color:var(--navOn)}
.navbtn .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;flex:none}
.navbtn.on .dot{opacity:1;background:var(--accent)}
.navfoot{margin-top:auto;padding:16px 10px 0;font-size:12px;line-height:1.5}
.navfoot button{display:block;width:100%;background:none;border:1px solid rgba(255,255,255,.2);color:var(--navInk);border-radius:6px;padding:6px 10px;font-size:12.5px;margin-top:8px;text-align:left}
.navfoot button.guide{background:var(--accent);color:var(--accentInk);border-color:var(--accent);font-weight:600}
main{overflow-y:auto;padding:22px 28px 48px;min-width:0;position:relative}
.vhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.vhead h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.01em}
.vhead p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:76ch}
.rfp{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 7px;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:2px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 0 9px;font-size:14px;color:var(--muted);margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.kpi{background:var(--panel);padding:12px 14px}
.kpi b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:16px;min-width:0}
.panel>h2{font-size:15px;font-weight:600;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel>h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.pad{padding:14px}
.cc{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.half{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.mapwrap svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.feed{max-height:520px;overflow-y:auto}
.alert{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;border-left:3px solid transparent}
.alert:hover{background:var(--sunk)}
.alert.sel{background:var(--sunk);border-left-color:var(--accent)}
.alert .t{font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.alert .t time{font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap}
.alert .d{font-size:13px;color:var(--muted)}
.alert.done{opacity:.55}
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.sev.high{background:var(--bad)}.sev.med{background:var(--warn)}.sev.low{background:var(--muted)}
.detail{padding:14px;font-size:14px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:0 0 12px;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td,tbody tr.selrow td{background:var(--sunk)}
td small,.mut{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.tag{display:inline-block;font-size:12px;border-radius:4px;padding:1px 7px;border:1px solid var(--line);white-space:nowrap}
.tag.DW{color:var(--dw);border-color:color-mix(in srgb,var(--dw) 35%,transparent)}
.tag.WW{color:var(--ww);border-color:color-mix(in srgb,var(--ww) 35%,transparent)}
.tag.TE{color:var(--te);border-color:color-mix(in srgb,var(--te) 35%,transparent)}
.st{font-size:13px;white-space:nowrap}
.st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--muted);vertical-align:1px}
[dir="rtl"] .st::before{margin-right:0;margin-left:6px}
.st.ok::before{background:var(--ok)}.st.warn::before{background:var(--warn)}.st.bad::before{background:var(--bad)}.st.act::before{background:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.stages{display:flex;flex-wrap:wrap;margin:6px 0 14px}
.stage{font-size:12.5px;padding:5px 10px;border:1px solid var(--line);margin-right:-1px;color:var(--muted);background:var(--sunk)}
.stage:first-child{border-radius:5px 0 0 5px}.stage:last-child{border-radius:0 5px 5px 0}
.stage.done{color:var(--ok);background:var(--panel)}
.stage.cur{color:var(--accentInk);background:var(--accent);border-color:var(--accent)}
.docs{list-style:none;padding:0;margin:0 0 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 18px;font-size:13.5px}
.note{font-size:13px;color:var(--muted);padding:12px 14px;margin:0}
.empty{padding:28px 14px;color:var(--muted);font-size:14px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px}
.fld{margin-bottom:12px}
.form .fld{margin:0}
.fld>label,.fld>.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.fld select,.fld textarea,.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=tel]{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
input.inl{width:84px;font:inherit;font-size:13.5px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);text-align:right}
select.inl{font:inherit;font-size:13.5px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.bars{display:flex;flex-direction:column;gap:8px;padding:14px}
.bar{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.banner{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;background:color-mix(in srgb,var(--warn) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line))}
.banner.okb{background:color-mix(in srgb,var(--ok) 12%,var(--panel));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.banner.badb{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.banner.info{background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.switch{width:44px;height:26px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--ok)}
.switch.on::after{left:21px}
[dir="rtl"] .switch::after{left:auto;right:3px;transition:right .15s}
[dir="rtl"] .switch.on::after{right:21px}
.switch.sm{width:36px;height:21px}.switch.sm::after{width:15px;height:15px}.switch.sm.on::after{left:18px}
.pmodal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.pmodal .box2{background:var(--panel);border-radius:12px;width:min(640px,100%);max-height:90vh;overflow-y:auto}
.pmodal .box2>h2{font-size:17px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.pmodal .body{padding:16px}
.pmodal .foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.guide ol{padding-left:20px;margin:0}
.guide li{margin-bottom:12px;font-size:14px}
.guide li p{margin:2px 0 6px;color:var(--muted);font-size:13px}
/* phone */
.phonestage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.phone{width:384px;height:800px;border-radius:38px;background:var(--panel);border:10px solid #1A1F22;position:relative;overflow:hidden;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;padding:16px 16px 20px;position:relative}
.screen[dir="rtl"]{text-align:right}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ptop h3{margin:0;font-size:20px;font-weight:600;line-height:1.25}
.ptop .sub{font-size:13px;color:var(--muted)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;position:relative;white-space:nowrap}
.iconbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--panel)}
.tabbar button{flex:1;background:none;border:0;padding:10px 2px 12px;font-size:12.5px;color:var(--muted);position:relative}
.tabbar button.on{color:var(--accent);font-weight:600}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 14px);background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
.card{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px;background:var(--panel);display:block;width:100%;text-align:inherit}
.card.sunk{background:var(--sunk)}
.card.hl{border:2px solid var(--accent)}
.card h4{margin:0 0 4px;font-size:14.5px;font-weight:600}
.card p{margin:0;font-size:13.5px;color:var(--muted)}
.cta{width:100%;border:0;border-radius:12px;padding:16px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accentInk);margin-bottom:10px;text-align:center}
.cta.sec{background:var(--sunk);color:var(--ink);border:1px solid var(--line);font-size:14.5px;padding:12px}
.cta.danger{background:var(--panel);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));font-size:14.5px;padding:12px}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;background:var(--panel);border:0;padding:9px 4px;font-size:13px;border-inline-end:1px solid var(--line)}
.seg button:last-child{border-inline-end:0}
.seg button.on{background:var(--ink);color:var(--panel)}
.svc{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:14px}
.svc button{display:flex;gap:12px;align-items:center;text-align:inherit;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px}
.svc button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.svc i{width:12px;height:36px;border-radius:4px;flex:none}
.svc b{display:block;font-size:14.5px}
.svc span{font-size:12.5px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;font-size:13px}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:600}
.reco{font-size:13px;background:var(--sunk);border-radius:8px;padding:9px 11px;margin-bottom:12px}
.wiz{display:flex;gap:6px;margin-bottom:14px}
.wiz span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wiz span.on{background:var(--accent)}
.wizl{font-size:12.5px;color:var(--muted);margin:-8px 0 12px}
.bill{font-size:13.5px;margin-bottom:12px}
.bill div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-variant-numeric:tabular-nums}
.bill .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:7px;font-weight:600;font-size:15px}
.tl{list-style:none;padding:0;margin:0 0 12px}
.tl li{position:relative;padding:0 0 12px 24px;font-size:13.5px;color:var(--muted)}
[dir="rtl"] .tl li{padding:0 24px 12px 0}
.tl li::before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;border:2px solid var(--line);background:var(--panel)}
[dir="rtl"] .tl li::before{left:auto;right:5px}
.tl li::after{content:"";position:absolute;left:10px;top:18px;bottom:0;width:1px;background:var(--line)}
[dir="rtl"] .tl li::after{left:auto;right:10px}
.tl li:last-child::after{display:none}
.tl li.done{color:var(--ink)}
.tl li.done::before{background:var(--ok);border-color:var(--ok)}
.tl li.cur{color:var(--ink);font-weight:600}
.tl li.cur::before{border-color:var(--accent);background:var(--accent)}
.tl li small{display:block;font-weight:400;color:var(--muted)}
.minimap{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.minimap svg{display:block;width:100%;height:auto}
.eta{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:inherit}
.lrow small{display:block;color:var(--muted);font-size:12.5px}
.verify{font-size:12.5px;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px}
.verify span::before{content:"✓ ";color:var(--ok)}
.chat{font-size:13px;display:flex;flex-direction:column;gap:6px;margin:8px 0}
.bub{max-width:82%;padding:6px 10px;border-radius:10px;background:var(--sunk)}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accentInk)}
[dir="rtl"] .bub.me{align-self:flex-start}
.stars{display:flex;gap:4px;margin:8px 0}
.stars button{background:none;border:0;font-size:30px;line-height:1;color:var(--line);padding:0}
.stars button.on{color:#E2A21B}
.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:inherit}
.box{width:20px;height:20px;border:2px solid var(--line);border-radius:5px;flex:none;display:grid;place-items:center;font-size:13px;color:var(--accentInk)}
.box.on{background:var(--accent);border-color:var(--accent)}
.money{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--panel);width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:92%;overflow-y:auto}
canvas.sig{width:100%;height:120px;border:1px dashed var(--line);border-radius:8px;touch-action:none;background:var(--sunk);display:block}
.photo{height:110px;border-radius:8px;background:var(--sunk);border:1px dashed var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);margin-bottom:10px;overflow:hidden}
.otp{display:flex;gap:10px;justify-content:center;margin:16px 0}

.si-back{display:inline-flex;gap:6px;align-items:center;background:rgba(232,241,242,.05);border:1px solid rgba(232,241,242,.2);color:#E8F1F2;border-radius:999px;padding:7px 14px 7px 10px;font:inherit;font-size:13px;font-weight:700}.si-back svg{width:16px;height:16px}
.si-lang .sp{flex:1}.si-lang{justify-content:flex-start}
.si-app{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 12px 6px 10px;border-radius:999px;background:rgba(23,179,198,.14);color:#3FD0DE;font-size:13px;font-weight:800}.si-app svg{width:16px;height:16px}
.app.solo{grid-template-columns:1fr}.app.solo nav.side{display:none}
.app.solo:not(.web) main{background:linear-gradient(135deg,#03111A 0%,#07242C 55%,#09414A 100%)}
.ph-bar,.wtop{display:flex;align-items:center;gap:14px;margin:-4px 0 22px;flex-wrap:wrap}
.ph-bar{color:#E8F1F2}.ph-bar small{color:#93AEB3}.wtop{color:var(--ink);padding-bottom:18px;border-bottom:1px solid var(--line)}.wtop small{color:var(--muted)}
.ph-bar .nl,.wtop .nl{color:#fff;--nama-mark:#fff}:root[data-theme="light"] .wtop .nl{color:#2D2A26;--nama-mark:#E62A36}
.ph-bar .nl svg,.wtop .nl svg{width:82px;height:auto;display:block}
.ph-bar .dv,.wtop .dv{width:1px;height:38px;background:currentColor;opacity:.22}
.ph-bar b,.wtop b{display:block;font-size:16px}.ph-bar small,.wtop small{display:block;font-size:12.5px}
.ph-bar .sp,.wtop .sp{flex:1}
.pill-btn{background:rgba(232,241,242,.06);border:1px solid rgba(232,241,242,.2);color:#E8F1F2;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center}.pill-btn svg{width:16px;height:16px}
.wtop .pill-btn{color:var(--ink);border-color:var(--line);background:var(--panel)}
.ph-page .vhead{display:none}
.ph-duo{display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.duo-t{color:#E8F1F2;font-size:15px;margin:0 0 10px;text-align:center}
.duo-n{width:300px;color:#B5C7CB;font-size:14px;line-height:1.5;background:rgba(15,47,56,.8);border:1px solid rgba(232,241,242,.12);border-radius:18px;padding:20px;margin-top:32px}.duo-n h3{color:#E8F1F2;margin:0 0 10px;font-size:16px}.duo-n ol{padding-left:18px;margin:0 0 16px}.duo-n li{margin-bottom:8px}.duo-n b{color:#E8F1F2}
.dlogin{padding:24px 4px}.dlogin h2{font-size:28px;margin:22px 0 8px}.ph-logo{color:var(--ink)}.ph-logo svg{width:140px;height:auto;display:block}
.phone:has(.dlogin) .tabbar{display:none}
@media(max-width:1100px){.lch{padding:28px 20px}.lc-groups{grid-template-columns:1fr}.lc-card{min-height:0}}
@media(max-width:560px){.lc-cards{grid-template-columns:1fr}.lc-live{flex-wrap:wrap}}
@media(max-width:820px){.app.solo main{padding:16px 12px}}

/* ---------- simulation ---------- */
function stepToward(o,tx,ty,sp){const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);if(d<=sp){o.x=tx;o.y=ty;return true}o.x+=dx/d*sp;o.y+=dy/d*sp;return false}
let tickN=0;
function tick(){
  tickN++;
  S.tankers.forEach(t=>{if(t.status!=='Active')return;if(tickN%6===0){t.hist.push({x:t.x,y:t.y});if(t.hist.length>80)t.hist.shift()}
    if(stepToward(t,t.tx,t.ty,t.sp)){t.phase=(t.phase+1)%2;let n;
     if(t.type==='DW')n=t.phase?nearest(t,'fill','DW'):landPoint();else if(t.type==='TE')n=t.phase?SITES.find(s=>s.id==='T1'):landPoint();else n=t.phase?landPoint():nearest(t,'discharge');
     t.tx=n.x+R(-6,6);t.ty=n.y+R(-6,6)}});
  const d=S.demo;let changed=false;
  if(d.orderId&&d.route[d.step]&&!d.arrived){const tg=d.route[d.step].target;if(stepToward(d,tg.x,tg.y,S.drv.auto?6:4.5)){d.arrived=true;changed=true;arrivedAt(d.route[d.step]);if(S.drv.auto)setTimeout(autoStep,2600)}}
  if(tickN%25===0){newAlert();if(S.view==='control')renderFeed()}
  if(S.drv.offerT>0){S.drv.offerT--;const el=$('#offerT');if(el)el.textContent=S.drv.offerT+'s';if(S.drv.offerT===0&&S.drv.offer){audit('Dispatch',`Direct offer for ${S.drv.offer} timed out — kept in open jobs`,'Dispatch');S.drv.offer=null;changed=true}}
  if(changed){render();return}
  if($('#cc-tk'))S.tankers.forEach(t=>{const e=document.getElementById('tk-'+t.i);if(e)e.setAttribute('transform',`translate(${t.x.toFixed(1)},${t.y.toFixed(1)})`)});
  ['cc','cm','dm'].forEach(id=>{const e=document.getElementById(id+'-demo');if(e)e.innerHTML=demoG(id==='cc')});
  ['cm','dm'].forEach(id=>{const sv=document.getElementById(id);if(sv&&d.orderId&&d.route[d.step])sv.setAttribute('viewBox',phoneVB([d,d.route[d.step].target,d.dest],id==='cm'?330:290))});
  const eta=$('#eta');if(eta)eta.textContent=etaText();const e2=$('#eta2');if(e2)e2.textContent=etaText();
  const dd=$('#drvDist');if(dd&&d.route[d.step])dd.textContent=(dist(d,d.route[d.step].target)*0.045).toFixed(1)+' km';
}
function arrivedAt(step){const o=ord(S.demo.orderId);if(step.kind==='cust'){o.events.push({s:'Arrived',t:new Date()});notify(o.cname,`Your tanker ${S.demo.id} has arrived.`,'Push')}}
function etaText(){const d=S.demo;if(!d.orderId)return'—';const o=ord(d.orderId);
  if(d.arrived&&d.route[d.step].kind==='cust')return S.cust.lang==='ar'?'وصل':'Arrived';
  let rem=0;for(let k=d.step;k<d.route.length;k++){const from=k===d.step?d:d.route[k-1].target;rem+=dist(from,d.route[k].target);if(d.route[k].kind==='cust')break}
  const m=Math.max(1,Math.round(rem*0.12));return S.cust.lang==='ar'?m+' دقيقة':m+' min'}

const tabOf=(k,d)=>S.tab[k]||d;
function tabs(k,list){const cur=tabOf(k,list[0][0]);return`<div class="tabs" role="tablist">${list.map(([id,l])=>`<button role="tab" aria-selected="${cur===id}" class="${cur===id?'on':''}" data-act="tab" data-k="${k}" data-v="${id}">${l.replace(/\s*\((\d+)\)$/,'<span class="tc">$1</span>')}</button>`).join('')}</div>`}
const kpis=a=>`<div class="kpis">${a.map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
const stt=(t,c)=>`<span class="st ${c||''}">${t}</span>`;
const tag=t=>`<span class="tag ${t}">${t}</span>`;
function bars(rows,max,fmt=v=>v.toLocaleString(),col){return`<div class="bars">${rows.map(([l,v,c])=>`<div class="bar"><span>${l}</span><div class="track"><div class="fill" style="width:${Math.min(100,v/max*100).toFixed(1)}%;background:${c||col||'var(--accent)'}"></div></div><span class="num">${fmt(v)}</span></div>`).join('')}</div>`}
const OST={requested:['Waiting for tanker','warn'],scheduled:['Scheduled','act'],assigned:['Assigned','act'],enroute:['En route','act'],collected:['Collected','act'],delivered:['Delivered','ok'],completed:['Completed','ok'],cancelled:['Cancelled','bad']};
const sw=(on,act,extra='')=>`<button class="switch sm ${on?'on':''}" data-act="${act}" ${extra} aria-pressed="${on}" aria-label="Toggle"></button>`;

function tripLog(t){if(t.log)return t.log;const out=[];for(let k=0;k<7;k++){const a=t.type==='WW'?pick(LOCS):nearest(t,'fill',t.type==='TE'?'TE':'DW'),b=t.type==='WW'?nearest(t,'discharge'):pick(LOCS);
  out.push({t:ago(40+k*RI(55,80)),from:a.name,to:b.name,g:t.cap,km:R(4,26).toFixed(1),min:RI(18,64),geo:Math.random()>.08})}return t.log=out}
function vFleet(){
  const tb=tabOf('fleet','tankers');const f=S.filter.fleet||'all';
  const list=S.tankers.filter(t=>f==='all'||(f==='exp'?t.permitExp<Date.now():f===t.type));
  let body='';
  if(tb==='tankers'){const t=S.sel.fleet!=null?S.tankers[S.sel.fleet]:null;
    body=`<div class="panel"><div class="toolbar"><div class="chips">${[['all','All'],['DW','Drinking water'],['WW','Wastewater'],['TE','Treated effluent'],['exp','Expired permit']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="flt" data-k="fleet" data-v="${k}">${l}</button>`).join('')}</div><div class="btns">${['CSV','XLS','XML'].map(x=>`<button class="btn sm" data-act="export" data-k="Fleet register" data-f="${x}">Export ${x}</button>`).join('')}</div></div>
    <div class="tblwrap" style="max-height:380px;overflow-y:auto"><table><thead><tr><th>Tanker</th><th>Type</th><th class="num">Capacity</th><th>Owner</th><th>Driver</th><th>Permit</th><th>Water test</th><th>IVMS</th><th>Status</th></tr></thead><tbody>
    ${list.map(t=>`<tr class="click ${S.sel.fleet===t.i?'selrow':''}" data-act="selFleet" data-i="${t.i}"><td>${t.plate}</td><td>${tag(t.type)}</td><td class="num">${t.cap.toLocaleString()}</td><td>${(OWNERS.find(o=>o.id===t.owner)||{}).name}</td><td>${t.driver}</td><td>${t.permitExp<Date.now()?stt('Expired','bad'):t.permitExp-Date.now()<30*864e5?stt(dsh(t.permitExp),'warn'):stt(dsh(t.permitExp),'ok')}</td><td>${t.type==='DW'?dsh(t.waterTest):'—'}</td><td>${stt('±'+t.acc.toFixed(1)+' m','ok')}</td><td>${t.status==='Active'?stt('Active','ok'):stt(t.status,'bad')}</td></tr>`).join('')}</tbody></table></div></div>
    ${t?`<div class="two"><div class="panel"><h2>Route history — ${t.plate} <small>last ${t.hist.length} GPS fixes</small></h2><div class="mapwrap">${mapSVG({id:'fh',vb:cropVB(t.hist.length?[...t.hist,t]:[t]),path:[...t.hist,t],props:[{x:t.x,y:t.y,label:t.plate}],demo:false,fs:16})}</div><p class="note">Route builds as the simulation runs; leave this open to watch it extend.</p></div>
      <div class="panel"><h2>Trip log <small>today</small></h2><div class="tblwrap"><table><thead><tr><th>Time</th><th>From → To</th><th class="num">km</th><th>Geofence</th></tr></thead><tbody>${tripLog(t).map(r=>`<tr><td>${hhmm(r.t)}</td><td>${r.from}<br><small>→ ${r.to}</small></td><td class="num">${r.km}</td><td>${r.geo?stt('Verified','ok'):stt('Mismatch','bad')}</td></tr>`).join('')}</tbody></table></div>
      <div class="pad btns"><button class="btn bad" data-act="suspendTk" data-i="${t.i}">${t.status==='Active'?'Suspend tanker':'Reinstate tanker'}</button><button class="btn" data-act="export" data-k="Trip log ${t.plate}" data-f="CSV">Export trips</button></div></div></div>`:''}`}
  if(tb==='trips')body=`<div class="panel"><div class="toolbar"><span class="mut" style="font-size:13px">Latest completed trips across the fleet</span><div class="btns">${['CSV','XLS','XML','TXT'].map(x=>`<button class="btn sm" data-act="export" data-k="Trip logs" data-f="${x}">Export ${x}</button>`).join('')}</div></div><div class="tblwrap"><table><thead><tr><th>Time</th><th>Tanker</th><th>Type</th><th>From</th><th>To</th><th class="num">Gallons</th><th class="num">km</th><th class="num">Minutes</th><th>Geofence</th></tr></thead><tbody>
    ${S.tankers.slice(0,16).map(t=>{const r=tripLog(t)[0];return`<tr><td>${hhmm(r.t)}</td><td>${t.plate}</td><td>${tag(t.type)}</td><td>${r.from}</td><td>${r.to}</td><td class="num">${r.g.toLocaleString()}</td><td class="num">${r.km}</td><td class="num">${r.min}</td><td>${r.geo?stt('Verified','ok'):stt('Mismatch','bad')}</td></tr>`}).join('')}</tbody></table></div></div>`;
  if(tb==='ivms')body=kpis([['3,121 / 3,123','Devices reporting'],['99.2%','Fixes within ±10 m'],['1,284','Buffered fixes recovered after dropouts today'],['0','Records lost (dual-site replication)']])+
   `<div class="panel"><h2>IVMS devices</h2><div class="tblwrap"><table><thead><tr><th>Device</th><th>Tanker</th><th>Firmware</th><th>Last fix</th><th class="num">Accuracy</th><th>Signal</th><th>Sensors</th></tr></thead><tbody>
   ${S.tankers.slice(0,14).map((t,k)=>`<tr><td>IV-${70100+t.i}</td><td>${t.plate}</td><td>4.2.${k%3}</td><td>${t.ping} s ago</td><td class="num">±${t.acc.toFixed(1)} m</td><td>${k===5?stt('Weak','warn'):stt('Good','ok')}</td><td>GPS, valve, ${t.type==='WW'?'pump':'flow meter'}, door</td></tr>`).join('')}</tbody></table></div>
   <p class="note">Devices buffer fixes during network dropouts and upload on reconnect. Firmware updates are pushed centrally by the vendor after NWS change approval.</p></div>`;
  return head('Fleet','Every registered tanker with its permit, water-quality and IVMS status, plus trip logs and route history. Exports in CSV, XLS, XML and TXT.')+tabs('fleet',[['tankers','Tankers'],['trips','Trip logs'],['ivms','IVMS devices']])+body}

  ${o?`<div class="two"><div class="panel"><h2>${o.id} <small>${esc(o.cname)} · ${esc(o.loc.name)}</small></h2><div class="detail">

    <div class="btns">${o.status==='requested'?`<select class="inl" id="asgTk" aria-label="Tanker to assign"><option value="demo">${S.demo.id} (demo driver${S.drv.online?', online':', offline'})</option>${S.tankers.filter(t=>t.type===o.type&&t.status==='Active'&&t.permitExp>Date.now()).slice(0,6).map(t=>`<option value="${t.i}">${t.plate} · ${zoneOf(t)}</option>`).join('')}</select><button class="btn pri" data-act="assign" data-id="${o.id}">Assign</button>`:''}
    ${['requested','scheduled','assigned'].includes(o.status)?`<button class="btn" data-act="opsResched" data-id="${o.id}">Move to tomorrow 8–10 am</button><button class="btn bad" data-act="opsCancel" data-id="${o.id}">Cancel order</button>`:''}
    ${['delivered','completed'].includes(o.status)&&!o.refund?`<button class="btn" data-act="refund" data-id="${o.id}">Refund to wallet</button>`:''}</div></div></div>

function cTimelineH(o){const ev=n=>o.events.find(e=>e.s===n);const steps=o.type==='WW'?[['Requested','tl_req'],['Assigned','tl_asg2'],['Arrived','tl_way2'],['Collected','tl_col'],['Discharged','tl_dis2']]:[['Requested','tl_req'],['Assigned','tl_asg2'],['Filled','tl_fill2'],['Arrived','tl_way2'],['Delivered','tl_del']];const n=steps.filter(s=>ev(s[0])).length;

   ${o.rating?`<div class="banner okb">${t('thanks')} · ${o.rating}★</div>`:''}

/* ===== 07 Driver jobs ===== */
function dJobs(){const v=S.drv,d=S.demo;const tb=v.jtab;const jobs=openJobs().sort((a,b)=>(b.emergency-a.emergency)||dist(d,a.loc)-dist(d,b.loc));
  const offer=v.offer&&ord(v.offer);const cts=S.contracts.filter(k=>k.owner==='O-201'&&k.status==='Pending owner acceptance');
  const km=o=>(dist(d,o.loc)*0.045).toFixed(1);const sl=o=>SLOTS.find(s=>s.id===o.slot).label;
  let b='';
  if(tb==='jobs'){
    b=(!v.online?`<div class="dj-ban">${ico('alert')}<span>You are offline. Finish the safety check on Home and go online to accept jobs.</span></div>`:'')+(d.orderId?`<div class="banner info">Finish your current trip before accepting another job.</div>`:'')+

      <div class="dj-rows"><div>${ico('pin')}<span><b>${esc(offer.loc.name)}</b><small>${km(offer)} km away · ${sl(offer)}</small></span></div><div>${ico('route')}<span><b>Fill at ${nearest(offer.loc,'fill',offer.type==='TE'?'TE':'DW').name}</b><small>On the way to the customer</small></span></div></div>
      <div class="dj-tag">${tagL(offer.type)}<small>${offer.gallons.toLocaleString()} gal · customer rating 4.9</small></div><div class="dj-btns"><button class="cta sec" data-act="decline">Decline</button><button class="cta" data-act="accept" data-id="${offer.id}">Accept job</button></div></div>`:'')+
    `<h4 class="ch-sec">${offer?'Other open jobs near you':'Open jobs near you'}</h4>`+
    (jobs.filter(o=>!offer||o.id!==offer.id).map(o=>`<div class="dj-job"><div class="row"><span><b>${o.id}</b>${o.emergency||o.slot==='now'?stt('Priority +50%','warn'):''}</span><b class="e">${omr(o.price.driver)}</b></div><small>${o.gallons.toLocaleString()} gal · ${esc(o.loc.name)} · ${km(o)} km · ${sl(o)}</small><button class="btn sm pri" data-act="accept" data-id="${o.id}" ${!v.online||d.orderId?'disabled':''}>Accept</button></div>`).join('')||`<div class="empty">No open jobs right now. New requests appear here instantly.</div>`)}
  if(tb==='contracts')b=cts.length?cts.map(k=>{const loc=k.loc||prop(k.prop);return `<div class="dj-offer"><div class="row"><b class="nj">Contract offer · ${k.id}</b>${stt('New','warn')}</div><div class="money" style="font-size:26px">${omr(k.monthly*S.cfg.driverShare*.55)}</div><small>Expected per month</small><div class="dj-rows"><div>${ico('pin')}<span><b>${esc(cust(k.cust)?.n)}</b><small>${esc(loc.name)}</small></span></div><div>${ico('clock')}<span><b>${k.freq} · ${k.gallons.toLocaleString()} gal</b><small>${dsh(k.start)} – ${dsh(k.end)}</small></span></div></div><div class="dj-btns"><button class="cta sec" data-act="ctDecline" data-id="${k.id}">Decline</button><button class="cta" data-act="ctAccept" data-id="${k.id}">Accept contract</button></div></div>`}).join(''):`<div class="empty">No contract offers. When a customer picks your company for a monthly or yearly plan, it appears here.</div>`;

/* ===== 08 Driver trip ===== */
function dJob(){const d=S.demo;if(!d.orderId)return `<div class="dj-h"><div><h3>Trip</h3><small>No trip in progress</small></div></div><div class="empty">Accept a job to start a trip.<br><br><button class="btn pri" data-act="ds" data-k="jobs">Open jobs</button></div>`;
  const o=ord(d.orderId),st=d.route[d.step],p=o.loc;const dk=(dist(d,st.target)*0.045).toFixed(1);const cost=tariffBz(o.type,o.gallons)/1000;
  const rows=st.kind==='fill'?[['meter','Station meter (TFS)',`${o.gallons.toLocaleString()} gal`,d.arrived?stt('Match','ok'):stt('Waiting','')],['coins','Filling credit',`${n3(S.drv.fillCredit)} → ${n3(Math.max(0,S.drv.fillCredit-cost))} OMR`,''],['check','Tank hatch and valves sealed','Safety check done','']]
   :st.kind==='cust'?[['drop','Deliver',`${o.gallons.toLocaleString()} gal · ${TYPE[o.type]}`,''],['pin','Customer note',esc(o.note||'No note'),''],['user','Customer',`${esc(o.cname)} · masked number`,'']]

function buildRoute(o){const p=o.loc;
  if(o.type==='WW'){const dis=nearest(p,'discharge');return[{label:'Drive to '+p.name,target:p,kind:'cust',action:'Capture proof of collection'},{label:'Discharge at '+dis.name,target:dis,kind:'discharge',action:'Confirm discharge at '+dis.name}]}
  const f=nearest(p,'fill',o.type==='TE'?'TE':'DW');return[{label:'Fill at '+f.name,target:f,kind:'fill',action:`Confirm filling — ${o.gallons.toLocaleString()} gal`},{label:'Deliver to '+p.name,target:p,kind:'cust',action:'Capture proof of delivery'}]}
function createOrder(x){const o=Object.assign({id:newOid(),created:new Date(),status:'requested',tanker:null,sla:'on',events:[{s:'Requested',t:new Date()}],plan:'one'},x);o.zone=zoneOf(o.loc);o.price=price(o);S.orders.unshift(o);dispatch(o);return o}
function dispatch(o){if(S.drv.manual&&S.drv.online&&!S.demo.orderId&&(!S.drv.offer||o.cust==='C-1001')&&o.type===S.demo.type&&o.gallons<=S.demo.cap&&!['s3','s4'].includes(o.slot)){S.drv.offer=o.id;S.drv.offerT=60;audit('Dispatch',`${o.id} offered to ${S.demo.id} — nearest online tanker with a valid permit`,'Dispatch')}}
function acceptJob(o){const d=S.demo;o.status=o.type==='WW'?'enroute':'assigned';o.tanker=d.id;o.events.push({s:'Assigned',t:new Date()});d.orderId=o.id;d.step=0;d.arrived=false;d.route=buildRoute(o);d.dest=o.loc;S.drv.offer=null;S.drv.offerT=0;S.chat=[];
  notify(o.cname,`${d.driver} (${d.id}) accepted your order ${o.id}.`,'Push');audit('Driver',`${d.id} accepted ${o.id} — expected earnings ${omr(o.price.driver)}`,'Dispatch')}

const AUTO_TK={DW:['OM 4821 AR','Salim Al Harthy','Al Harthy Water Transport'],WW:['63391 SM','Hilal Al Shukaili','Muttrah Sewage Services'],TE:['51120 TR','Badar Al Ghafri','Green Fields TE Supply']};
function autoDispatch(o){if(['s3','s4'].includes(o.slot))return;
  setTimeout(()=>{if(o.status!=='requested'||S.demo.orderId||S.drv.manual)return;
    S.drv.auto=true;S.drv.online=true;PRE.forEach((_,k)=>S.drv.pre[k]=true);
    acceptJob(o);const a=AUTO_TK[o.type];o.tanker=a[0];o.driverName=a[1];o.ownerName=a[2];
    S.chat.push({from:'drv',text:o.type==='WW'?(AR()?'مرحباً، أنا في الطريق إليك.':'Hello, I am on my way to you.'):(AR()?'مرحباً، أنا في الطريق إلى محطة التعبئة.':'Hello, heading to the filling station now.')});
    toast(AR()?`قبل ${a[1]} طلبك`:`${a[1]} accepted your order`);render()},3500)}
function autoStep(){const d=S.demo;if(!S.drv.auto||!d.orderId||!d.arrived)return;const o=ord(d.orderId),st=d.route[d.step];
  if(st.kind==='fill'){const cost=tariffBz(o.type,o.gallons)/1000;if(S.drv.fillCredit<cost){S.drv.fillCredit+=20;ledger('Top-up','Al Harthy Water Transport',20,'Filling credit (auto top-up)')}A.stepAct()}
  else if(st.kind==='cust'){S.drv.pod={photo:true,signed:true};S.chat.push({from:'drv',text:AR()?'وصلت إلى البوابة.':'I am at your gate.'});A.podSubmit()}
  else A.stepAct()}
function finishJob(o){S.drv.earn.today+=o.price.driver;S.drv.earn.week+=o.price.driver;S.demo.orderId=null;S.demo.route=[];S.drv.screen='home'}

 selOrd:e=>{S.sel.ord=e.dataset.id;render()},

 // permits
 selPermit:e=>{S.sel.permit=S.sel.permit===e.dataset.id?null:e.dataset.id;render()},
 pAdvance:e=>{const p=S.permits.find(x=>x.id===e.dataset.id);if(p.stage===1&&p.docs.some(d=>!d.ok)){toast('Documents missing — request them first');return}p.state='open';

   else{p.stage++;audit('Salma Al Kalbani',`${p.id} moved to ${p.stages[p.stage]}`,'Permits')}render()},

 insp:e=>{const i=S.inspections.find(x=>x.id===e.dataset.id);i.res=e.dataset.k;audit('Ibrahim Al Jabri',`${i.id}: ${i.res}`,'Enforcement');render()},

 selCx:e=>{S.sel.cx=e.dataset.id;render()},

   if(k==='assign'){c.owner='Tanker ops team';c.state='In progress';c.notes.push({t:new Date(),s:'Assigned to tanker ops team'})}

   if(k==='refund'){c.notes.push({t:new Date(),s:'1.000 OMR refunded to wallet'});ledger('Refund',c.cust,-1,c.id);if(c.cust==='Fatma Al Lawati')S.cust.wallet+=1}
   if(k==='resolve'){c.state='Resolved';c.notes.push({t:new Date(),s:'Resolved; customer notified'});notify(c.cust,`Your complaint ${c.id} is resolved.`,'SMS')}
   audit('Noor Al Habsi',`${c.id}: ${c.notes[c.notes.length-1].s}`,'Complaints');render()},

 // customer
 lang:()=>{S.cust.lang=S.cust.lang==='en'?'ar':'en';render()},

 cs:e=>{S.cust.screen=e.dataset.k;S.cust.sheet=null;render()},

 w:e=>{const w=S.cust.w,f=e.dataset.f;let v=e.dataset.v;if(f==='gallons')v=+v;if(f==='emergency'||f==='split')v=v==='true';w[f]=v;if(f==='type'){w.gallons=VOLS[v].includes(w.gallons)?w.gallons:VOLS[v][1];if(v==='TE')w.prop='P2'}render()},
 wNext:()=>{S.cust.w.step++;render()},wBack:()=>{S.cust.w.step--;render()},
 applyPromo:()=>{const c=val('promoIn').trim().toUpperCase();const p=S.promos.find(x=>x.code===c&&x.active);if(p){S.cust.w.promo=c;toast(`${c}: ${p.pct}% off applied`)}else{S.cust.w.promo='';toast(AR()?'الرمز غير صالح':'That code is not valid or has expired')}render()},
 placeOrder:()=>{const w=S.cust.w;const p=prop(w.prop);
   const o=createOrder({cust:'C-1001',cname:'Fatma Al Lawati',prop:p.id,loc:p,type:w.type,gallons:w.gallons,slot:w.slot,emergency:w.emergency,promo:w.promo,note:w.note,split:w.split,plan:'one',pay:w.pay});
   if(w.pay==='wallet'){S.cust.wallet-=Math.min(S.cust.wallet,o.price.youPay)}S.cust.points+=Math.round(o.price.youPay*S.cfg.ptsPerOMR);
   ledger('Payment','Fatma Al Lawati',o.price.youPay,o.id);if(w.promo)S.promos.find(x=>x.code===w.promo).uses++;
   if(['s3','s4'].includes(w.slot))o.status='scheduled';
   notify('Fatma Al Lawati',`Order ${o.id} confirmed. Total ${omr(o.price.total)}.`,'SMS');audit('Customer',`Fatma Al Lawati placed ${o.id}: ${TYPE[o.type]} ${o.gallons} gal, ${omr(o.price.youPay)} by ${w.pay}`,'Orders');
   if(!S.drv.manual)autoDispatch(o);S.cust.cur=o.id;S.cust.detail=o.id;S.cust.screen='detail';S.cust.rating=0;S.cust.tip=0;render();
   toast((S.drv.manual&&!S.drv.online)?(AR()?'تم الطلب — افتح تطبيق السائق لقبوله':'Order placed — open the driver app to accept it'):(AR()?'تم الطلب — نبحث عن أقرب صهريج مرخص':'Order placed — finding the nearest permitted tanker'))},
 openOrder:e=>{S.cust.detail=e.dataset.id;S.cust.screen='detail';render()},
 sheet:e=>{S.cust.sheet=e.dataset.k||null;render()},
 custCancel:()=>{const o=ord(S.cust.detail);cancelOrder(o,o.status==='assigned'?S.cfg.cancelFee:0,'Customer');S.cust.sheet=null;render()},

 cChat:e=>{S.chat.push({from:'cust',text:e.dataset.k});render()},
 rate:e=>{S.cust.rating=+e.dataset.k;render()},tip:e=>{S.cust.tip=+e.dataset.k;render()},
 submitRating:()=>{const o=ord(S.cust.detail);o.rating=S.cust.rating;o.tip=S.cust.tip;if(o.tip){S.drv.earn.today+=o.tip;S.drv.earn.tips+=o.tip;S.cust.wallet-=o.tip;ledger('Tip','Salim Al Harthy',o.tip,o.id)}
   audit('Customer',`Rated ${o.id} ${o.rating}★${o.tip?', tip '+omr(o.tip):''}`,'Complaints');if(o.rating<=2){S.cust.cxFor=o.id;S.cust.screen='complaint'}render()},

 ctSubmit:e=>{const k=S.cust.k;const c={id:'CT-'+RI(3130,3999),cust:'C-1001',prop:k.prop,owner:k.owner,type:k.type,gallons:k.gallons,freq:k.freq,plan:k.plan==='m6'?'month':k.plan,start:days(2),end:days(2+(k.plan==='year'?365:k.plan==='m6'?182:30)),status:'Pending owner acceptance',monthly:+e.dataset.est};

 ctPause:e=>{const k=S.contracts.find(x=>x.id===e.dataset.id);k.status=k.status==='Paused'?'Active':'Paused';audit('Customer',`${k.id} ${k.status==='Paused'?'paused':'resumed'}`,'Orders');render()},
 ctEnd:e=>{const k=S.contracts.find(x=>x.id===e.dataset.id);k.status='Ended';k.end=new Date();audit('Customer',`${k.id} ended`,'Orders');render()},
 ctAccept:e=>{const k=S.contracts.find(x=>x.id===e.dataset.id);k.status='Active';const c=cust(k.cust);notify(c.n,`${OWNERS.find(o=>o.id===k.owner).name} accepted contract ${k.id}. First delivery ${dsh(k.start)}.`,'Push');audit('Owner',`Al Harthy Water Transport accepted ${k.id}`,'Orders');toast('Contract accepted — customer notified');render()},
 ctDecline:e=>{const k=S.contracts.find(x=>x.id===e.dataset.id);k.status='Declined';notify(cust(k.cust).n,`Contract ${k.id} was declined. Choose another company in the app.`,'Push');audit('Owner',`Declined ${k.id}`,'Orders');render()},
 cTopup:e=>{const v=+e.dataset.k;S.cust.wallet+=v;ledger('Top-up','Fatma Al Lawati',v,'Visa ••4417');audit('Customer',`Wallet top-up ${omr(v)}`,'Payments');render()},
 redeem:()=>{S.cust.points-=S.cfg.ptsRedeem;S.cust.wallet+=1;ledger('Refund','Fatma Al Lawati',-1,'Loyalty redemption');render()},
 cPref:e=>{const k=e.dataset.k;if(k==='autopay')S.cust.autopay=!S.cust.autopay;else S.cust.prefs[k]=!S.cust.prefs[k];audit('Customer',`Preference ${k} changed`,'Customers');render()},
 addProp:()=>{const id='P'+RI(10,99);const pt={x:R(330,380),y:R(150,170)};PROPS.push({id,cust:'C-1001',name:val('npA'),label:val('npL'),seg:'Residential',...pt,tank:+val('npT'),avg:5});cust('C-1001').props.push(id);S.cust.sheet=null;audit('Customer',`Added property ${val('npA')}`,'Customers');render()},
 // driver
 ds:e=>{S.drv.screen=e.dataset.k;render()},
 jtab:e=>{S.drv.jtab=e.dataset.k;render()},
 pre:e=>{const k=+e.dataset.k;S.drv.pre[k]=!S.drv.pre[k];render()},
 train:e=>{S.drv.training[+e.dataset.k]=true;toast('Plays the safety video — available in Arabic, English, Urdu and Hindi');render()},
 shift:()=>{if(!PRE.every((_,k)=>S.drv.pre[k])&&!S.drv.online)return;S.drv.manual=true;S.drv.auto=false;S.drv.online=!S.drv.online;audit('Driver',`${S.demo.id} went ${S.drv.online?'online':'offline'} (safety check complete)`,'Dispatch');
   if(S.drv.online){const q=S.orders.find(o=>o.cust==='C-1001'&&o.status==='requested')||openJobs()[0];if(q)dispatch(q);toast(openJobs().length+' open jobs near you — see Jobs')}render()},
 accept:e=>{const o=ord(e.dataset.id);if(!S.drv.online){toast('Go online first');return}if(S.demo.orderId){toast('Finish your current job first');return}if(o.status!=='requested'){toast('This job was taken by another tanker');render();return}acceptJob(o);S.drv.screen='job';render()},
 decline:()=>{audit('Driver',`${S.demo.id} declined ${S.drv.offer}`,'Dispatch');S.drv.offer=null;S.drv.offerT=0;render()},
 stepAct:()=>{const d=S.demo,o=ord(d.orderId),st=d.route[d.step];
   if(st.kind==='fill'){const cost=tariffBz(o.type,o.gallons)/1000;if(S.drv.fillCredit<cost){toast('Not enough filling credit — top up in Earnings');return}S.drv.fillCredit-=cost;
     o.status='enroute';o.events.push({s:'Filled',t:new Date()});audit('TFS',`${d.id} filled ${o.gallons} gal at ${st.target.name}; IVMS inside geofence`,'Integrations');notify(o.cname,`Your tanker is filled and on the way.`,'Push');d.step++;d.arrived=false;render();return}
   if(st.kind==='cust'){S.drv.pod={photo:false,signed:false};render();return}
   if(st.kind==='discharge'){o.status='completed';o.events.push({s:'Discharged',t:new Date()});audit('Driver',`${d.id} discharged ${o.gallons} gal at ${st.target.name} (geofence verified)`,'Enforcement');finishJob(o);toast('Discharge confirmed at an approved site');render()}},
 podPhoto:()=>{S.drv.pod.photo=true;render()},podClear:()=>{S.drv.pod.signed=false;render()},podNoSig:()=>{S.drv.pod.signed=true;S.drv.pod.nosig=true;render()},podClose:()=>{S.drv.pod=null;render()},
 podSubmit:()=>{const d=S.demo,o=ord(d.orderId);o.pod={t:new Date(),coords:'23.621°N 58.207°E',nosig:S.drv.pod.nosig};S.drv.pod=null;
   if(o.type==='WW'){o.status='collected';o.events.push({s:'Collected',t:new Date()});d.step++;d.arrived=false;audit('Driver',`Proof of collection for ${o.id}`,'Orders');notify(o.cname,'Wastewater collected. Rate your service in the app.','Push')}
   else{o.status='delivered';o.events.push({s:'Delivered',t:new Date()});audit('Driver',`Proof of delivery for ${o.id}; ${o.gallons} gal by flow meter`,'Orders');notify(o.cname,`Delivered ${o.gallons.toLocaleString()} gal. View proof of delivery and rate.`,'SMS');finishJob(o)}
   render();toast(o.type==='WW'?'Collected — head to the discharge site':'Delivered — customer notified')},
 dMsg:e=>{S.chat.push({from:'drv',text:e.dataset.k});const o=ord(S.demo.orderId);notify(o.cname,`Driver: ${e.dataset.k}`,'Push');audit('Driver','Message to customer (masked)','Orders');render();toast('Sent to the customer by push and SMS')},
 dIssue:()=>{S.drv.issue=true;render()},dIssueClose:()=>{S.drv.issue=false;render()},
 dIssueSend:e=>{const k=e.dataset.k;const o=ord(S.demo.orderId);S.drv.issue=false;
   if(k==='Vehicle breakdown'||k==='Accident'){o.status='requested';o.tanker=null;o.events.push({s:'Reassigning — '+k.toLowerCase(),t:new Date()});S.demo.orderId=null;S.demo.route=[];S.alerts.unshift({id:aid++,sev:'high',type:k+' reported',tk:0,plate:S.demo.id,text:`${S.demo.driver} reported ${k.toLowerCase()} on ${o.id}; job released`,t:new Date(),state:'open'});notify(o.cname,`Your tanker had a problem. We are assigning another one.`,'SMS');S.drv.screen='home';toast('Job released to the next nearest tanker; control centre alerted')}
   else{S.chat.push({from:'drv',text:k});toast('Control centre and customer notified')}audit('Driver',`${S.demo.id} reported: ${k}`,'Dispatch');render()},
 bank:()=>{ledger('Payout','Salim Al Harthy',-S.drv.earn.today,'Instant transfer','Pending');toast(omr(S.drv.earn.today)+' sent to '+OWNERS[0].bank+', arrives next working day');audit('Driver','Requested instant payout','Payments')},
 fillTop:()=>{S.drv.fillCredit+=10;ledger('Top-up','Al Harthy Water Transport',10,'Filling credit');audit('Owner','Filling credit top-up 10.000 OMR','Payments');render()},
 dispute:()=>{S.drv.disputed=true;audit('Driver','Disputed fine on TO-47790','Enforcement');toast('Dispute sent with IVMS trace — NWS replies within 5 working days');render()},
 renew:()=>{if(S.permits.some(p=>p.demo&&p.tanker===S.demo.id&&p.state!=='rejected')){toast('A renewal is already under review');return}newPermitApp(S.demo.id,'DW','Renewal');S.drv.permitRenew=S.permits[0].id;render();toast('Renewal submitted — it now appears in NWS Permits')},
 renew7720:()=>{if(S.permits.some(p=>p.demo&&p.tanker==='7720 SW')){toast('Already submitted');return}newPermitApp('7720 SW','WW','Renewal');render();toast('Renewal submitted')},
 docUp:e=>{S.drv.docUp[e.dataset.k]=true;audit('Owner','Uploaded new '+(e.dataset.k==='clean'?'tank cleanliness certificate':'ROP inspection'),'Permits');toast('Uploaded — NWS will verify within 1 working day');render()},
 shiftDay:e=>{const k=+e.dataset.k;S.drv.shiftDays[k]=S.drv.shiftDays[k]?0:1;S.ownerShift['Salim Al Harthy'][k]=S.drv.shiftDays[k];render()},
 // owner
 oShift:e=>{const a=S.ownerShift[e.dataset.n];const k=+e.dataset.k;a[k]=a[k]?0:1;if(e.dataset.n==='Salim Al Harthy')S.drv.shiftDays[k]=a[k];render()},
 mAddTanker:()=>{const pl=val('mPl');(S.newTankers=S.newTankers||[]).push({plate:pl,type:val('mTy'),cap:+val('mCap'),driver:'—',permit:null,ivms:val('mIv'),st:'Pending permit'});newPermitApp(pl,val('mTy'),'New permit');S.modal=null;render();toast('Tanker registered; permit application sent to NWS')},
 mAddDriver:()=>{S.drivers.push({id:'D-'+(S.drivers.length+1),n:val('mDn'),tk:'—',lic:new Date(val('mDe')),rating:0,ontime:0,acc:0,status:'Pending verification',owner:'O-201'});audit('Owner',`Registered driver ${val('mDn')}`,'Permits');S.modal=null;render()},
 mCallOrder:()=>{const c=cust(val('mCu'));const o=createOrder({cust:c.id,cname:c.n,loc:LOCS[+val('mL')],type:val('mT'),gallons:+val('mG'),slot:val('mSl'),emergency:val('mEm')==='1',channel:'Call centre'});notify(c.n,`Payment link for ${o.id}: pay.nws.om/${o.id}`,'SMS');audit('Noor Al Habsi',`Created ${o.id} for caller ${c.n}`,'Orders');S.modal=null;S.sel.ord=o.id;render();toast(`${o.id} created and dispatched`)}
};
function newPermitApp(tk,type,kind){const p={id:'PA-26-'+RI(1200,1299),owner:'Al Harthy Water Transport',type,kind,stage:0,stages:['Submitted','Document check','Field inspection','Approval','Issued'],tanker:tk,capacity:5000,submitted:new Date(),docs:['Vehicle registration (Mulkiya)','Driver licence (heavy)','Tank cleanliness certificate','ROP technical inspection','Insurance policy','IVMS installation certificate'].map(d=>({d,ok:true})),state:'open',demo:true};S.permits.unshift(p);audit('Owner',`Submitted ${kind.toLowerCase()} ${p.id} for ${tk}`,'Permits')}
function cancelOrder(o,fee,by){const refund=o.price.total-fee;o.status='cancelled';o.events.push({s:'Cancelled by '+by.toLowerCase(),t:new Date()});
  if(S.demo.orderId===o.id){S.demo.orderId=null;S.demo.route=[];S.drv.screen='home';toast('Job cancelled by the customer')}if(S.drv.offer===o.id){S.drv.offer=null;S.drv.offerT=0}
  if(o.cust==='C-1001')S.cust.wallet+=refund;ledger('Refund',o.cname,-refund,o.id);if(fee)ledger('Fine',o.cname,fee,o.id+' cancellation fee');
  notify(o.cname,`${o.id} cancelled. ${omr(refund)} refunded to your wallet${fee?' after a '+omr(fee)+' fee':''}.`,'SMS');audit(by,`Cancelled ${o.id}${fee?' (fee '+omr(fee)+')':''}`,'Orders')}

/* ---------- render ---------- */
function bindSig(){const c=$('#sig');if(!c)return;const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;const x=c.getContext('2d');x.scale(2,2);x.lineWidth=2.2;x.lineCap='round';x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink');let dn=false;
  const pos=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{dn=true;c.setPointerCapture(e.pointerId);const[a,b]=pos(e);x.beginPath();x.moveTo(a,b)};
  c.onpointermove=e=>{if(!dn)return;const[a,b]=pos(e);x.lineTo(a,b);x.stroke()};
  c.onpointerup=()=>{dn=false;if(!S.drv.pod.signed){S.drv.pod.signed=true;const btn=$('[data-act="podSubmit"]');if(btn&&S.drv.pod.photo)btn.disabled=false}}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el)}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.cfg){const v=parseFloat(el.value);if(isNaN(v))return;const path=el.dataset.cfg.split('.');if(path.length===2)S.cfg[path[0]][path[1]]=v;else S.cfg[path[0]]=v;audit('Maryam Al Balushi',`Pricing: ${el.dataset.cfg} set to ${v}`,'Administration');render();toast('Saved — applies to new orders');return}
  if(el.dataset.pen){const p=S.penalties.find(x=>x.id===el.dataset.pen);p.amt=parseFloat(el.value)||0;audit('Maryam Al Balushi',`Penalty "${p.trig}" set to ${omr(p.amt)}`,'Administration');toast('Saved');return}
  const k=el.dataset.chg;if(!k)return;
  if(k==='rb'){S.rb[el.dataset.k]=el.value;render()}
  if(k==='role'){S.users[+el.dataset.k].r=el.value;audit('Maryam Al Balushi',`Role of ${S.users[+el.dataset.k].e} changed to ${el.value}`,'Administration');render()}
  if(k==='priv'){S.priv[el.dataset.k]=el.value}
  if(k==='emZone'){S.emergency.zone=el.value;render()}
  if(k==='emReason'){S.emergency.reason=el.value}
  if(k==='wnote'){S.cust.w.note=el.value}
  if(k==='drvTk'){S.drivers[+el.dataset.k].tk=el.value;audit('Owner',`${S.drivers[+el.dataset.k].n} assigned to ${el.value}`,'Fleet');render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;renderModal()}});

S.present=false;seed();S.app=null;S.auth={};S.drv.reg='login';S.view='control';render();setInterval(tick,400);
</script>
